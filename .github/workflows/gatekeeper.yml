# THE ONLY AUTOMATION. Two jobs, and why they are shaped this way.
#
# pull_request_target runs THIS file from main (the trusted copy), never a PR's edited version.
# (With plain pull_request a PR runs its own workflow files: an attacker could rewrite the check
# to always pass.)
#
# judge   has ZERO permissions: an empty token and no secrets. It is the only place a contributor's
#         code ever executes (inside headless Chrome, for the brick test), so there is nothing in it
#         to steal. Its tooling comes from main: the checkout is main, the PR is fetched as data and
#         only its entities/ and assets/ files are placed into the tree.
# merge   holds write access and never checks out or runs anything. It merges exactly the commit
#         that was judged, only if judge passed; a push after judging makes the merge fail.
#         It also holds the DAILY CAP: every merge is one Cloudflare build, the free plan allows 500
#         a month, and a flood of tiny valid PRs could otherwise spend them all. Over the cap, a
#         passing PR waits: it is re-judged when reopened (or pushed to) on a later day.
#
# No Cloudflare credential exists in this repository: Cloudflare Pages pulls and builds it itself.
name: gatekeeper
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions: {}
concurrency:
  group: gatekeeper-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  judge:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check out main (trusted tooling only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the PR as data
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.clone_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git fetch --no-tags "$HEAD_REPO" "$HEAD_SHA"
      - name: The Law (static)
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-pr.mjs "$(git rev-parse HEAD)" "$HEAD_SHA"
      - name: Place EVERY file the PR changed into main's tree
        # Derived from the PR itself, not a hand-kept list. The Law above already proved every
        # changed path is in the world, so this is exactly the world as it would be after merge.
        # (It used to copy only entities/ and assets/, so a change to engine.js or lib/ was
        # brick-tested against main's OLD engine: found by the red team, 2026-09-26.)
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only -z --diff-filter=AM "$(git rev-parse HEAD)...$HEAD_SHA" \
            | xargs -0 -r git checkout "$HEAD_SHA" --
      - name: Install the brick test's one dependency (pinned, from main's lockfile)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: The brick test (the world must keep living)
        run: node scripts/brick-test.mjs
  merge:
    needs: judge
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge exactly what was judged (within the daily cap)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MAIN: ${{ github.event.repository.default_branch }}
          DAILY_CAP: 10
        run: |
          # Commits on main in the last 24 hours: one per merge, so one per build. Only merges
          # (and Keepers) put commits on main, so no contributor can move this number.
          since=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          merged=$(gh api --paginate "repos/$GITHUB_REPOSITORY/commits?sha=$MAIN&since=$since&per_page=100" --jq length | awk '{n+=$1} END {print n+0}')
          if [ "$merged" -ge "$DAILY_CAP" ]; then
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "This passed every check. The world takes $DAILY_CAP additions a day and today's are used, so it has not been merged yet. Close and reopen this pull request (or push any commit) after a day and it will be judged and merged then."
            echo "Daily cap reached ($merged merges in 24h); not merging."
            exit 0
          fi
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --match-head-commit "$HEAD_SHA"
